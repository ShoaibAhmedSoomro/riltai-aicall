services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    networks:
      - app-network
    volumes:
      - .:/workspaces/dograh:cached
      - rilt-venv:/workspaces/rilt/venv
      - rilt-ui-node_modules:/workspaces/rilt/ui/node_modules
      - rilt-ts-validator-node_modules:/workspaces/rilt/api/mcp_server/ts_validator/node_modules
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:8000:8000"
volumes:
  rilt-venv:
  rilt-ui-node_modules:
  rilt-ts-validator-node_modules:
