services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    networks:
      - app-network
    volumes:
      - .:/workspaces/dograh:cached
      - social-cangaroo-venv:/workspaces/social-cangaroo/venv
      - social-cangaroo-ui-node_modules:/workspaces/social-cangaroo/ui/node_modules
      - social-cangaroo-ts-validator-node_modules:/workspaces/social-cangaroo/api/mcp_server/ts_validator/node_modules
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:8000:8000"
volumes:
  social-cangaroo-venv:
  social-cangaroo-ui-node_modules:
  social-cangaroo-ts-validator-node_modules:
